
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b12">
<title>NEXUS AI</title>
<style>
:root{
 --bg:#090b12;--side:#0d1019;--panel:#141927;
 --line:#262d40;--text:#edf0fa;--muted:#929bb0;
 --accent:#9585ff;--blue:#6596ff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
 font:15px/1.6 Inter,system-ui,Arial;height:100dvh;overflow:hidden}
button,textarea{font:inherit}
button{cursor:pointer;color:inherit}
.app{height:100%;display:flex}
.sidebar{width:265px;background:var(--side);border-right:1px solid var(--line);
 display:flex;flex-direction:column;padding:17px 13px;flex-shrink:0}
.brand{font-size:19px;font-weight:800;letter-spacing:1px;padding:8px 7px 22px}
.logo{display:inline-grid;place-items:center;width:34px;height:34px;
 background:linear-gradient(135deg,#a18bff,#557fff);border-radius:11px;margin-right:8px}
.new{background:#191e2d;border:1px solid #343b50;border-radius:11px;
 padding:11px;text-align:left}
.new:hover{border-color:var(--accent)}
.label{font-size:11px;color:#778198;letter-spacing:1.4px;margin:25px 8px 10px}
.history{flex:1;overflow:auto}
.history button{width:100%;display:block;text-align:left;background:none;border:0;
 color:#aeb6c8;padding:10px;border-radius:9px;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis;font-size:13px}
.history button:hover,.history button.active{background:#202638;color:white}
.sidefoot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding:14px 5px}
.dot{display:inline-block;width:7px;height:7px;background:#48c78e;border-radius:50%;margin-right:7px}
main{flex:1;min-width:0;display:flex;flex-direction:column}
header{height:62px;border-bottom:1px solid #202536;display:flex;
 align-items:center;justify-content:space-between;padding:0 23px}
.model{font-size:13px;color:#c5ccdc}
.actions button{border:0;background:transparent;color:var(--muted);padding:8px}
.actions button:hover{color:white}
.scroll{flex:1;overflow:auto;scroll-behavior:smooth}
.chat{max-width:820px;margin:auto;padding:35px 24px;min-height:100%}
.welcome{text-align:center;margin:10vh auto 0}
.orb{width:68px;height:68px;border-radius:23px;margin:auto auto 22px;
 display:grid;place-items:center;font-size:30px;
 background:radial-gradient(circle at 30% 20%,#c0b4ff,#7468df 65%,#384b9d);
 box-shadow:0 0 55px #8170ff35}
h1{font-size:clamp(29px,5vw,43px);letter-spacing:-1.5px;margin:0}
.sub{color:var(--muted);margin:8px 0 28px}
.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:590px;margin:auto}
.suggestion{background:#121725;border:1px solid #2a3145;border-radius:12px;
 padding:13px;text-align:left;color:#cbd1e0;font-size:13px}
.suggestion:hover{border-color:var(--accent);background:#191e30}
.message{display:flex;gap:13px;margin:0 0 28px;animation:fade .2s}
.avatar{width:30px;height:30px;flex-shrink:0;border-radius:10px;
 background:#252b3e;display:grid;place-items:center;font-size:13px}
.assistant .avatar{background:linear-gradient(135deg,#9585ff,#527ce4)}
.body{flex:1;min-width:0}
.role{font-size:12px;color:#929bb0;font-weight:700;margin-bottom:6px}
.content{overflow-wrap:anywhere;white-space:pre-wrap}
.content pre{white-space:pre;overflow:auto;background:#080b12;
 border:1px solid #2b3143;border-radius:10px;padding:14px}
.content code{font-family:Consolas,monospace;color:#c9bdff}
.mini{font-size:11px;color:#929bb0;background:none;border:0;padding:6px 8px}
.mini:hover{color:white}
.composer-wrap{padding:12px 20px 17px;background:linear-gradient(transparent,var(--bg) 20%)}
.composer{max-width:820px;margin:auto;background:#141927;
 border:1px solid #343b50;border-radius:17px;padding:10px 12px}
.composer:focus-within{border-color:#8879ef;box-shadow:0 0 0 3px #9585ff12}
textarea{width:100%;resize:none;max-height:170px;min-height:30px;
 background:transparent;border:0;outline:0;color:white;padding:5px}
textarea::placeholder{color:#7d879e}
.bottom{display:flex;align-items:center;justify-content:space-between}
.hint{font-size:10px;color:#737e95}
.send{width:35px;height:35px;border:0;border-radius:10px;
 background:linear-gradient(135deg,#9585ff,#6596ff);font-size:20px}
.send:disabled{opacity:.35}
.disclaimer{text-align:center;color:#667087;font-size:10px;margin-top:8px}
.typing{display:flex;gap:5px;padding:8px}
.typing i{width:6px;height:6px;background:#a49aff;border-radius:50%;animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);
 background:#252b3e;border:1px solid #424b63;border-radius:9px;padding:9px 14px;
 opacity:0;transition:.2s;font-size:12px}
.toast.show{opacity:1}
@keyframes b{50%{transform:translateY(-5px)}}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1}}
@media(max-width:700px){
 .sidebar{position:fixed;z-index:5;inset:0 auto 0 0;transform:translateX(-105%);
 transition:.2s;box-shadow:15px 0 40px #0008}
 .sidebar.open{transform:translateX(0)}
 .menu{display:inline-block!important}
 header{padding:0 12px}
 .chat{padding:25px 14px}
 .composer-wrap{padding:9px 11px 13px}
 .suggestions{grid-template-columns:1fr}
 .welcome{margin-top:7vh}
}
.menu{display:none}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
 <div class="brand"><span class="logo">✳</span>NEXUS <span style="color:#a99bff">AI</span></div>
 <button class="new" id="newChat">＋ &nbsp; Nueva conversación</button>
 <div class="label">CONVERSACIONES</div>
 <div class="history" id="history"></div>
 <div class="sidefoot"><span class="dot"></span>NEXUS listo<br>
 <span style="padding-left:15px">Historial guardado en este navegador</span></div>
</aside>
<main>
 <header>
  <div class="model"><button class="actions menu" id="menu">☰</button> &nbsp; ✳ &nbsp; NEXUS · Asistente IA</div>
  <div class="actions"><button id="clear" title="Borrar conversación">⌫</button></div>
 </header>
 <div class="scroll" id="scroll"><div class="chat" id="chat"></div></div>
 <div class="composer-wrap">
  <form class="composer" id="form">
   <textarea id="input" rows="1" placeholder="Escribe un mensaje a NEXUS..."></textarea>
   <div class="bottom">
    <span class="hint">Intro para enviar · Shift + Intro para saltar línea</span>
    <button class="send" id="send" disabled>↑</button>
   </div>
  </form>
  <div class="disclaimer">NEXUS puede cometer errores. Comprueba la información importante.</div>
 </div>
</main>
</div>
<div class="toast" id="toast"></div>

<script>

const API_URL = "https://nexus-ai.jacogalcraft.workers.dev";

const KEY = "nexus_chats_v1";
let chats = [];
let current = null;
let busy = false;

try { chats = JSON.parse(localStorage.getItem(KEY) || "[]"); }
catch(e) { chats = []; }

const $ = s => document.querySelector(s);

function save(){
 localStorage.setItem(KEY,JSON.stringify(chats));
}

function makeId(){
 return Date.now().toString(36)+Math.random().toString(36).slice(2);
}

function activeChat(){
 return chats.find(c=>c.id===current);
}

function notify(text){
 const t=$("#toast");
 t.textContent=text;
 t.classList.add("show");
 setTimeout(()=>t.classList.remove("show"),2200);
}

function safe(text){
 return String(text).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[c]);
}

function format(text){
 const parts=text.split(/```([\w-]*)\n?([\s\S]*?)```/g);
 let html="";
 for(let i=0;i<parts.length;i+=3){
  html+=safe(parts[i]||"").replace(/\n/g,"<br>");
  if(parts[i+2]!==undefined){
   html+="<pre><code>"+safe(parts[i+2])+"</code></pre>";
  }
 }
 return html;
}

function newChat(){
 const c={id:makeId(),title:"Nueva conversación",messages:[],time:Date.now()};
 chats.push(c);
 current=c.id;
 save();
 render();
 $("#input").focus();
}

function render(){
 const chat=$("#chat");
 chat.innerHTML="";
 const c=activeChat();

 if(!c || !c.messages.length){
  const welcome=document.createElement("div");
  welcome.className="welcome";
  welcome.innerHTML=`
   <div class="orb">✳</div>
   <h1>¿Qué tienes en mente?</h1>
   <p class="sub">Piensa, crea y descubre con NEXUS AI.</p>
   <div class="suggestions">
    <button class="suggestion">Explícame un concepto difícil de forma sencilla</button>
    <button class="suggestion">Ayúdame a crear una página web</button>
    <button class="suggestion">Dame ideas para un proyecto original</button>
    <button class="suggestion">Organiza un plan para aprender algo nuevo</button>
   </div>`;
  welcome.querySelectorAll(".suggestion").forEach(b=>{
   b.onclick=()=>{ $("#input").value=b.textContent;resize();$("#send").disabled=false;$("#input").focus(); };
  });
  chat.append(welcome);
 }else{
  c.messages.forEach((m,index)=>{
   const row=document.createElement("article");
   row.className="message "+m.role;
   const avatar=document.createElement("div");
   avatar.className="avatar";
   avatar.textContent=m.role==="user"?"Tú":"✳";

   const body=document.createElement("div");
   body.className="body";
   const role=document.createElement("div");
   role.className="role";
   role.textContent=m.role==="user"?"TÚ":"NEXUS";

   const content=document.createElement("div");
   content.className="content";
   content.innerHTML=format(m.content);

   body.append(role,content);

   if(m.role==="assistant"){
    const copy=document.createElement("button");
    copy.className="mini";
    copy.textContent="Copiar";
    copy.onclick=()=>{
     if(navigator.clipboard) navigator.clipboard.writeText(m.content);
     notify("Respuesta copiada");
    };
    body.append(copy);

    if(index===c.messages.length-1){
     const regen=document.createElement("button");
     regen.className="mini";
     regen.textContent="Regenerar";
     regen.onclick=regenerate;
     body.append(regen);
    }
   }
   row.append(avatar,body);
   chat.append(row);
  });
 }

 if(busy){
  const row=document.createElement("div");
  row.className="message assistant";
  row.innerHTML='<div class="avatar">✳</div><div class="body"><div class="role">NEXUS</div><div class="typing"><i></i><i></i><i></i></div></div>';
  chat.append(row);
 }

 const history=$("#history");
 history.innerHTML="";
 [...chats].reverse().forEach(c=>{
  const b=document.createElement("button");
  b.textContent=c.title;
  if(c.id===current)b.classList.add("active");
  b.onclick=()=>{current=c.id;render();$("#sidebar").classList.remove("open");};
  history.append(b);
 });

 $("#scroll").scrollTop=$("#scroll").scrollHeight;
}

function resize(){
 const p=$("#input");
 p.style.height="auto";
 p.style.height=Math.min(p.scrollHeight,170)+"px";
}

async function requestAI(messages){
 if(!API_URL.startsWith("https://")){
  throw new Error("Primero configura la URL de Cloudflare en el código.");
 }

 const response=await fetch(API_URL,{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({messages})
 });

 const data=await response.json();

 if(!response.ok){
  throw new Error(data.error||"Error del servidor: "+response.status);
 }
 return data.reply;
}

async function sendMessage(text){
 if(busy || !text.trim())return;
 if(!activeChat())newChat();

 const c=activeChat();
 c.messages.push({role:"user",content:text.trim()});

 if(c.messages.length===1){
  c.title=text.trim().slice(0,38)+(text.length>38?"…":"");
 }

 c.time=Date.now();
 $("#input").value="";
 resize();
 $("#send").disabled=true;
 busy=true;
 save();
 render();

 try{
  const reply=await requestAI(c.messages.slice(-16));
  c.messages.push({
   role:"assistant",
   content:reply||"No he recibido una respuesta."
  });
 }catch(error){
  c.messages.push({
   role:"assistant",
   content:"No he podido responder.\n\n"+error.message
  });
 }finally{
  busy=false;
  save();
  render();
  $("#input").focus();
 }
}

async function regenerate(){
 const c=activeChat();
 if(!c||busy||c.messages.length<2)return;

 if(c.messages.at(-1).role==="assistant")c.messages.pop();

 busy=true;
 render();

 try{
  const reply=await requestAI(c.messages.slice(-16));
  c.messages.push({role:"assistant",content:reply});
 }catch(e){
  c.messages.push({role:"assistant",content:"Error: "+e.message});
 }finally{
  busy=false;
  save();
  render();
 }
}

$("#form").addEventListener("submit",e=>{
 e.preventDefault();
 sendMessage($("#input").value);
});

$("#input").addEventListener("input",()=>{
 resize();
 $("#send").disabled=!$("#input").value.trim()||busy;
});

$("#input").addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){
  e.preventDefault();
  $("#form").requestSubmit();
 }
});

$("#newChat").onclick=newChat;

$("#clear").onclick=()=>{
 const c=activeChat();
 if(!c)return;
 c.messages=[];
 c.title="Nueva conversación";
 save();
 render();
};

$("#menu").onclick=()=>$("#sidebar").classList.toggle("open");

if(chats.length){
 chats.sort((a,b)=>b.time-a.time);
 current=chats[0].id;
}else{
 newChat();
}
render();
</script>
</body>
</html>
